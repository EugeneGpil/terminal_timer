services:
  timer:
    build:
      context: .
      network: host
    image: timer-php:local
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /repo
    security_opt:
      - apparmor=unconfined   # Ubuntu's AppArmor blocks container -> session DBus (notifications)
    environment:
      # host timezone name; /etc/timezone is no longer reliable on Ubuntu (set by the Makefile)
      TZ: ${TZ:-}
      # host PipeWire-Pulse and DBus session bus; same-uid peer auth, no cookie needed
      PULSE_SERVER: unix:/run/user/${UID:-1000}/pulse/native
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/${UID:-1000}/bus
      # display mode override: plain | fancy | empty = auto (settable via .env)
      TIMER_MODE: ${TIMER_MODE:-}
      # telegram notification at the alarm; empty = disabled (settable via .env)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - .:/repo
      - /usr/share/sounds:/usr/share/sounds:ro
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse:/run/user/${UID:-1000}/pulse:ro
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/bus:/run/user/${UID:-1000}/bus:ro
